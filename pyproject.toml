[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rockchip-summary-notifier"
version = "0.1.0"
description = "Multi-preset RSS consensus summaries for small local LLM runtimes"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rss-notifier = "rss_notifier.__main__:main"

[tool.setuptools.packages.find]
include = ["rss_notifier*"]
